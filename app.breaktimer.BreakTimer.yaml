app-id: app.breaktimer.BreakTimer
branch: stable
runtime: org.freedesktop.Platform
runtime-version: '24.08'
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: run-breaktimer
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: breaktimer
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/breaktimer/flatpak-node/cache
        npm_config_cache: /run/build/breaktimer/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node22
        npm_config_offline: 'true'
    build-commands:
      - jq '.build.linux.target="dir"' <<< $(<package.json) > package.json
      - npm install
      - |
        . flatpak-node/electron-builder-arch-args.sh
        npm run package-linux -- $ELECTRON_BUILDER_ARCH_ARGS
      - cp -a release/linux*unpacked /app/main
      - install -Dm644 resources/icon.png
        /app/share/icons/hicolor/256x256/apps/app.breaktimer.BreakTimer.png
      - install -Dm644 app.breaktimer.BreakTimer.desktop -t /app/share/applications
      - install -Dm644 app.breaktimer.BreakTimer.metainfo.xml -t /app/share/metainfo
      - install -Dm755 run.sh /app/bin/run-breaktimer
    sources:
      - type: git
        url: https://github.com/tom-james-watson/breaktimer-app.git
        tag: v2.0.0
        commit: f8b57e14a570843fceae020dd96a22d0cd92b28f
      - generated-sources.json
      - type: file
        path: app.breaktimer.BreakTimer.metainfo.xml
      - type: file
        path: app.breaktimer.BreakTimer.desktop
      - type: script
        dest-filename: run.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/main/breaktimer "$@"
